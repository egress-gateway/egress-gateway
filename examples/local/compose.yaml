services:
  upstream:
    build:
      context: ../..
      dockerfile: examples/local/upstream/Dockerfile
  egress:
    image: ${GATEWAY_IMAGE:-egress-gateway:dev}
    build:
      context: ../..
      dockerfile: image/Dockerfile
    environment:
      GATEWAY_ROLE: egress
      GATEWAY_PROXY_MODE: standalone
      ENVOY_CONFIG: /example/envoy.yaml
      OPA_CONFIG: /example/opa.yaml
    volumes:
      - ./egress-envoy.yaml:/example/envoy.yaml:ro
      - ./policies/egress.rego:/example/policy.rego:ro
      - ./egress-opa.yaml:/example/opa.yaml:ro
    command: [--policy, /example/policy.rego]
    depends_on:
      upstream:
        condition: service_started
  workload:
    image: ${GATEWAY_IMAGE:-egress-gateway:dev}
    build:
      context: ../..
      dockerfile: image/Dockerfile
    environment:
      GATEWAY_ROLE: workload
      GATEWAY_PROXY_MODE: standalone
      ENVOY_CONFIG: /example/envoy.yaml
      OPA_CONFIG: /example/opa.yaml
    volumes:
      - ./workload-envoy.yaml:/example/envoy.yaml:ro
      - ./policies/workload.rego:/example/policy.rego:ro
      - ./workload-opa.yaml:/example/opa.yaml:ro
    command: [--policy, /example/policy.rego]
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-18080}:8080'
    depends_on:
      egress:
        condition: service_healthy
