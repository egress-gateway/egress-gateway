apiVersion: v1
kind: List
items:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: receiver
    namespace: gateway-origin
  spec:
    replicas: 1
    selector:
      matchLabels: {app: receiver}
    template:
      metadata:
        labels: {app: receiver}
        annotations: {sidecar.istio.io/inject: "false"}
      spec:
        automountServiceAccountToken: false
        containers:
        - name: receiver
          image: ${CURL_TEST_IMAGE}
          imagePullPolicy: Never
          command: [/usr/local/bin/gateway-e2e-probe, -mode, serve]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            tcpSocket: {port: 8081}
          volumeMounts:
          - {name: tls, mountPath: /tls, readOnly: true}
        volumes:
        - name: tls
          secret: {secretName: origin-tls}
- apiVersion: v1
  kind: Pod
  metadata:
    name: probe-control
    namespace: gateway-origin
    annotations: {sidecar.istio.io/inject: "false"}
  spec:
    automountServiceAccountToken: false
    containers:
    - name: probe
      image: ${CURL_TEST_IMAGE}
      imagePullPolicy: Never
      command: [/bin/sh, -c, exec sleep 2147483647]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      volumeMounts:
      - {name: receiver-trust, mountPath: /etc/receiver-trust, readOnly: true}
    volumes:
    - name: receiver-trust
      configMap: {name: receiver-trust}
