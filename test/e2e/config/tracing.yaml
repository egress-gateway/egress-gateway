apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: gateway-test
data:
  collector.yaml: |
    receivers:
      otlp/envoy:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
      otlp/opa:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      file/envoy:
        path: /data/envoy.json
        flush_interval: 100ms
      file/opa:
        path: /data/opa.json
        flush_interval: 100ms
    service:
      pipelines:
        traces/envoy:
          receivers: [otlp/envoy]
          exporters: [file/envoy]
        traces/opa:
          receivers: [otlp/opa]
          exporters: [file/opa]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: gateway-test
spec:
  selector:
    app: otel-collector
  ports:
  - name: grpc-otlp
    port: 4317
  - name: http-otlp
    port: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: gateway-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: collector
        image: "${OTEL_COLLECTOR_IMAGE}"
        imagePullPolicy: IfNotPresent
        args: ["--config=/etc/collector/collector.yaml"]
        readinessProbe:
          tcpSocket:
            port: 4317
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: config
          mountPath: /etc/collector
          readOnly: true
        - name: data
          mountPath: /data
      - name: reader
        image: "${CURL_TEST_IMAGE}"
        imagePullPolicy: Never
        command: ["sh", "-c", "sleep infinity"]
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: otel-collector
      - name: data
        emptyDir:
          sizeLimit: 32Mi
---
# This is external native Istio configuration, not generated by the daemon.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: gateway-tracing
  namespace: gateway-test
spec:
  tracing:
  - providers:
    - name: fixture-otel
    randomSamplingPercentage: 100
    customTags:
      fixture.request_id:
        header:
          name: x-request-id

---
# Keep correlation UUIDs unchanged when tracing is enabled in this fixture.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: tracing-request-id
  namespace: gateway-test
spec:
  configPatches:
  - applyTo: NETWORK_FILTER
    match:
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
    patch:
      operation: MERGE
      value:
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          request_id_extension:
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
              pack_trace_reason: false
              use_request_id_for_trace_sampling: false
