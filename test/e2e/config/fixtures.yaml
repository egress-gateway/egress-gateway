apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: Namespace
  metadata:
    labels:
      istio-injection: disabled
    name: gateway-test
- apiVersion: v1
  kind: Namespace
  metadata:
    labels:
      istio-injection: disabled
    name: gateway-origin
- apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: workload
    namespace: gateway-test
- apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: egress
    namespace: gateway-test
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: origin
    namespace: gateway-origin
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: origin
    template:
      metadata:
        annotations:
          sidecar.istio.io/inject: "false"
        labels:
          app: origin
      spec:
        containers:
        - image: ${ORIGIN_TEST_IMAGE}
          imagePullPolicy: Never
          name: origin
          ports:
          - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
- apiVersion: v1
  kind: Service
  metadata:
    name: origin
    namespace: gateway-origin
  spec:
    ports:
    - name: http
      port: 80
      targetPort: 8080
    selector:
      app: origin
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: egress
    namespace: gateway-test
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: egress
    template:
      metadata:
        labels:
          app: egress
      spec:
        serviceAccountName: egress
        terminationGracePeriodSeconds: 20
- apiVersion: v1
  kind: Service
  metadata:
    name: egress
    namespace: gateway-test
  spec:
    ports:
    - name: https-mesh
      port: 8080
      targetPort: 8080
    - name: https-inspection
      port: 8443
      targetPort: 8443
    selector:
      app: egress
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      app: workload
    name: workload
    namespace: gateway-test
  spec:
    containers:
    - command:
      - /bin/sh
      - -c
      - exec sleep 2147483647
      image: ${CURL_TEST_IMAGE}
      name: curl
      volumeMounts:
      - name: receiver-trust
        mountPath: /etc/receiver-trust
        readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsGroup: 1000
        runAsUser: 1000
    initContainers:
    - name: business-network-state
      image: "${CURL_TEST_IMAGE}"
      command: ["sh", "-ec", "for name in all default lo eth0; do printf '%s=' \"$name\"; cat /proc/sys/net/ipv6/conf/$name/disable_ipv6; done"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
    serviceAccountName: workload
    volumes:
    - name: receiver-trust
      configMap:
        name: receiver-trust
    terminationGracePeriodSeconds: 20
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: origin-https
    namespace: gateway-origin
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: origin-https
    template:
      metadata:
        annotations:
          sidecar.istio.io/inject: "false"
        labels:
          app: origin-https
      spec:
        containers:
        - env:
          - name: ORIGIN_TLS_CERT
            value: /certs/tls.crt
          - name: ORIGIN_TLS_KEY
            value: /certs/tls.key
          image: ${ORIGIN_TEST_IMAGE}
          imagePullPolicy: Never
          name: origin
          ports:
          - containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: 8443
          volumeMounts:
          - mountPath: /certs
            name: tls
            readOnly: true
        volumes:
        - name: tls
          secret:
            secretName: origin-tls
- apiVersion: v1
  kind: Service
  metadata:
    name: origin-https
    namespace: gateway-origin
  spec:
    ports:
    - name: tls
      port: 443
      targetPort: 8443
    selector:
      app: origin-https

- apiVersion: v1
  kind: Service
  metadata:
    name: blocked-workload
    namespace: gateway-origin
  spec:
    ports:
    - name: http
      port: 80
      targetPort: 8080
    selector:
      app: origin

- apiVersion: v1
  kind: Service
  metadata:
    name: notblocked-workload
    namespace: gateway-origin
  spec:
    ports:
    - name: http
      port: 80
      targetPort: 8080
    selector:
      app: origin

- apiVersion: v1
  kind: Service
  metadata:
    name: blocked-egress
    namespace: gateway-origin
  spec:
    ports:
    - name: http
      port: 80
      targetPort: 8080
    selector:
      app: origin

- apiVersion: v1
  kind: Service
  metadata:
    name: notblocked-egress
    namespace: gateway-origin
  spec:
    ports:
    - name: http
      port: 80
      targetPort: 8080
    selector:
      app: origin
