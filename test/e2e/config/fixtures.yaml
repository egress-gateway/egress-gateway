apiVersion: v1
items:
- apiVersion: v1
  kind: Namespace
  metadata:
    labels:
      istio-injection: disabled
    name: gateway-test
- apiVersion: v1
  kind: Namespace
  metadata:
    labels:
      istio-injection: disabled
    name: gateway-origin
- apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: workload
    namespace: gateway-test
- apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: egress
    namespace: gateway-test
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: origin
    namespace: gateway-origin
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: origin
    template:
      metadata:
        annotations:
          sidecar.istio.io/inject: "false"
        labels:
          app: origin
      spec:
        containers:
        - image: ${ORIGIN_TEST_IMAGE}
          imagePullPolicy: Never
          name: origin
          ports:
          - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
- apiVersion: v1
  kind: Service
  metadata:
    name: origin
    namespace: gateway-origin
  spec:
    ports:
    - name: http
      port: 80
      targetPort: 8080
    selector:
      app: origin
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: egress
    namespace: gateway-test
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: egress
    template:
      metadata:
        labels:
          app: egress
      spec:
        serviceAccountName: egress
        terminationGracePeriodSeconds: 20
- apiVersion: v1
  kind: Service
  metadata:
    name: egress
    namespace: gateway-test
  spec:
    ports:
    - name: https-mesh
      port: 8080
      targetPort: 8080
    - name: https-inspection
      port: 8443
      targetPort: 8443
    selector:
      app: egress
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      app: workload
    name: workload
    namespace: gateway-test
  spec:
    containers:
    - command:
      - /bin/sh
      - -c
      - exec sleep 2147483647
      image: ${CURL_TEST_IMAGE}
      name: curl
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsGroup: 1000
        runAsUser: 1000
    initContainers:
    - name: business-network-state
      image: "${CURL_TEST_IMAGE}"
      command: ["sh", "-ec", "for name in all default lo eth0; do printf '%s=' \"$name\"; cat /proc/sys/net/ipv6/conf/$name/disable_ipv6; done"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
    serviceAccountName: workload
    terminationGracePeriodSeconds: 20
- apiVersion: networking.istio.io/v1
  kind: Gateway
  metadata:
    name: egress
    namespace: gateway-test
  spec:
    selector:
      app: egress
    servers:
    - hosts:
      - origin.gateway-origin.svc.cluster.local
      port:
        name: https-mesh
        number: 8080
        protocol: HTTPS
      tls:
        mode: ISTIO_MUTUAL
    - hosts:
      - '*'
      port:
        name: https-inspection
        number: 8443
        protocol: HTTPS
      tls:
        mode: ISTIO_MUTUAL
- apiVersion: networking.istio.io/v1
  kind: DestinationRule
  metadata:
    name: egress
    namespace: gateway-test
  spec:
    host: egress.gateway-test.svc.cluster.local
    trafficPolicy:
      portLevelSettings:
      - port:
          number: 8443
        tls:
          mode: ISTIO_MUTUAL
          sni: inspection.mesh
          subjectAltNames:
          - spiffe://cluster.local/ns/gateway-test/sa/egress
      tls:
        mode: ISTIO_MUTUAL
        sni: origin.gateway-origin.svc.cluster.local
        subjectAltNames:
        - spiffe://cluster.local/ns/gateway-test/sa/egress
- apiVersion: networking.istio.io/v1
  kind: VirtualService
  metadata:
    name: origin-via-egress
    namespace: gateway-test
  spec:
    gateways:
    - mesh
    - egress
    hosts:
    - origin.gateway-origin.svc.cluster.local
    http:
    - match:
      - gateways:
        - mesh
        port: 80
      route:
      - destination:
          host: egress.gateway-test.svc.cluster.local
          port:
            number: 8080
    - match:
      - gateways:
        - egress
        port: 8080
      route:
      - destination:
          host: origin.gateway-origin.svc.cluster.local
          port:
            number: 80
- apiVersion: networking.istio.io/v1alpha3
  kind: EnvoyFilter
  metadata:
    name: trace-request-id
    namespace: gateway-test
  spec:
    configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: MERGE
        value:
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            preserve_external_request_id: true
    workloadSelector:
      labels:
        app: egress
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: origin-https
    namespace: gateway-origin
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: origin-https
    template:
      metadata:
        annotations:
          sidecar.istio.io/inject: "false"
        labels:
          app: origin-https
      spec:
        containers:
        - env:
          - name: ORIGIN_TLS_CERT
            value: /certs/tls.crt
          - name: ORIGIN_TLS_KEY
            value: /certs/tls.key
          image: ${ORIGIN_TEST_IMAGE}
          imagePullPolicy: Never
          name: origin
          ports:
          - containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: 8443
          volumeMounts:
          - mountPath: /certs
            name: tls
            readOnly: true
        volumes:
        - name: tls
          secret:
            secretName: origin-tls
- apiVersion: v1
  kind: Service
  metadata:
    name: origin-https
    namespace: gateway-origin
  spec:
    ports:
    - name: tls
      port: 443
      targetPort: 8443
    selector:
      app: origin-https
- apiVersion: networking.istio.io/v1
  kind: VirtualService
  metadata:
    name: inspection-egress
    namespace: gateway-test
  spec:
    gateways:
    - egress
    hosts:
    - '*'
    http:
    - match:
      - port: 8443
      retries:
        attempts: 0
      route:
      - destination:
          host: origin-https.gateway-origin.svc.cluster.local
          port:
            number: 443
- apiVersion: networking.istio.io/v1
  kind: Sidecar
  metadata:
    name: workload
    namespace: gateway-test
  spec:
    egress:
    - hosts:
      - gateway-test/*
      - gateway-origin/origin.gateway-origin.svc.cluster.local
    workloadSelector:
      labels:
        app: workload
kind: List
